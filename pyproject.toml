[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bandi"
version = "0.1.0"
description = "Early Telegram donation bot prototype; payments are not implemented"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.21,<4", "aiohttp-socks>=0.10,<1"]

[tool.setuptools.packages.find]
include = ["donation_bot*"]
